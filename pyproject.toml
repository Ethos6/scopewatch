[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopewatch"
version = "0.1.0"
description = "A safe, passive security posture snapshot for websites you are authorized to assess."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ethos6" }]
keywords = ["web-security", "tls", "headers", "defensive-security", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]

[project.scripts]
scopewatch = "scopewatch_cli:main"

[tool.setuptools]
py-modules = ["scopewatch_cli", "scopewatch_scanner"]

